name: Android app
# Builds the APK. Run it by hand from the Actions tab, or push a tag such as android-v0.5.0 to also publish it as a release.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  # Drives the real interface in a browser, the way the app uses it: sign-in screen, dashboard, chat, offline queue, sign-out.
  flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: allovchat_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: go build -o allovchat .
      - run: npm install --prefix android/test --no-save puppeteer@23
      - name: Sign in, open a chat, go offline, come back
        env:
          ALLOV_BIN: ./allovchat
          DATABASE_URL: postgres://test:test@localhost:5432/allovchat_flow?sslmode=disable
        run: node android/test/flow.mjs

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the web interface into the app
        run: |
          mkdir -p android/app/src/main/assets/static
          cp -r static/. android/app/src/main/assets/static/
      - name: Check the interface is bundled
        run: bash android/check-assets.sh source
      - name: Test the app's address mapping against the real files
        run: gradle -p android testDebugUnitTest --no-daemon
      - name: Release signing key (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key set. The APK will be signed with a temporary debug key."
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('0.5.{0}', github.run_number) }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk allovchat.apk
      - name: Check the APK itself contains the interface
        run: bash android/check-assets.sh apk allovchat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: allovchat-apk
          path: allovchat.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: allovchat.apk

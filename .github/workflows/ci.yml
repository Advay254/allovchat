name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: allovchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod tidy
      - name: Commit go.mod and go.sum
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore: update go.mod and go.sum"
            git push
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/allovchat_test?sslmode=disable
        run: go test -count=1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Key vault end to end, with real WebCrypto
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/allovchat_test?sslmode=disable
        run: |
          go build -o allovchat .
          ALLOV_BIN=./allovchat node test/vault.mjs

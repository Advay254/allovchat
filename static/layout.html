<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/static/site.js"></script>
<title>{{.Title}}</title>
<meta name="description" content="{{.Desc}}">
<link rel="canonical" href="{{.Canon}}">
{{if .Noindex}}<meta name="robots" content="noindex">{{else}}<meta name="robots" content="index,follow,max-image-preview:large">{{end}}
<meta property="og:site_name" content="{{.Site}}">
<meta property="og:type" content="{{.Type}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Desc}}">
<meta property="og:url" content="{{.Canon}}">
<meta property="og:image" content="{{.Image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{.Site}} logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Desc}}">
<meta name="twitter:image" content="{{.Image}}">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="alternate" type="application/rss+xml" title="{{.Site}} blog" href="/feed.xml">
<link rel="stylesheet" href="/static/style.css">
<script type="application/ld+json">{{.LD}}</script>
</head>
<body>
<header class="nav"><div class="site navin">
<a class="brand" href="/">{{template "logo"}}<span>{{.Site}}</span></a>
<nav class="navlinks" aria-label="Main"><a href="/about">About</a><a href="/blog">Blog</a></nav>
<a class="btn sm" href="/app">Open app</a>
</div></header>
<main>{{template "content" .}}</main>
<footer class="foot"><div class="site">
<a class="brand" href="/" style="font-size:17px">{{template "logo"}}<span>{{.Site}}</span></a>
<span class="grow"></span>
<a href="/about">About</a><a href="/blog">Blog</a><a href="/feed.xml">RSS</a><a href="/llms.txt">llms.txt</a><a href="https://github.com/Advay254/allovchat">Source</a>
<span>&copy; {{.Year}} {{.Site}}</span>
</div></footer>
</body>
</html>
{{define "logo"}}<svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="10" width="30" height="27" rx="9" fill="#C8401B"/><rect x="22" y="22" width="32" height="30" rx="10" fill="currentColor"/><circle cx="31" cy="37" r="2.6" fill="var(--bg)"/><circle cx="38" cy="37" r="2.6" fill="var(--bg)"/><circle cx="45" cy="37" r="2.6" fill="var(--bg)"/></svg>{{end}}

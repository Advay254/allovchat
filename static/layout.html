<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/static/site.js"></script>
<title>{{.Title}}</title>
<meta name="description" content="{{.Desc}}">
<link rel="canonical" href="{{.Canon}}">
{{if .Noindex}}<meta name="robots" content="noindex">{{else}}<meta name="robots" content="index,follow,max-image-preview:large">{{end}}
<meta property="og:site_name" content="{{.Site}}">
<meta property="og:type" content="{{.Type}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Desc}}">
<meta property="og:url" content="{{.Canon}}">
<meta property="og:image" content="{{.Image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{.Site}} logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Desc}}">
<meta name="twitter:image" content="{{.Image}}">
<meta name="theme-color" content="#F5F8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="alternate" type="application/rss+xml" title="{{.Site}} blog" href="/feed.xml">
<link rel="stylesheet" href="/static/style.css">
<script type="application/ld+json">{{.LD}}</script>
</head>
<body>
<header class="nav"><div class="site navin">
<a class="brand" href="/" aria-label="{{.Site}} home">{{template "logo"}}<span class="wm">allov<b>chat</b></span></a>
<nav class="navlinks" aria-label="Main"><a href="/about">About</a><a href="/blog">Blog</a></nav>
<a class="btn sm" href="/app">Open app</a>
</div></header>
<main>{{template "content" .}}</main>
<footer class="foot"><div class="site">
<a class="brand" href="/" aria-label="{{.Site}} home">{{template "logo"}}<span class="wm" style="font-size:18px">allov<b>chat</b></span></a>
<span class="grow"></span>
<a href="/about">About</a><a href="/blog">Blog</a><a href="/feed.xml">RSS</a><a href="/llms.txt">llms.txt</a><a href="https://github.com/Advay254/allovchat">Source</a>
<span>&copy; {{.Year}} {{.Site}}</span>
</div></footer>
</body>
</html>
{{define "logo"}}<svg width="36" height="22" viewBox="0 0 100 60" aria-hidden="true"><path fill="#2563FF" fill-rule="evenodd" d="M28 4a26 26 0 1 0 0 52 26 26 0 0 0 0-52zm0 14a12 12 0 1 1 0 24 12 12 0 0 1 0-24z"/><path fill="#2563FF" d="M36 48l16 10-6-16z"/><path fill="currentColor" fill-rule="evenodd" d="M70 4A26 26 0 0 0 44 30 26 26 0 0 0 70 56H96V30A26 26 0 0 0 70 4zM70 17a11 11 0 1 0 0 22 11 11 0 0 0 0-22z"/><rect x="64" y="22" width="12" height="9" rx="4.5" fill="currentColor"/><path fill="currentColor" d="M65 30h5l-5 6z"/></svg>{{end}}

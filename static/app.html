<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inbox</title>
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<div id="auth" class="auth" hidden>
<form id="af" class="auth-card stag">
<img src="/favicon.svg" width="48" height="48" alt="">
<h1 id="atitle" class="ui-h">Welcome back</h1>
<label class="field">Username<input id="au" autocomplete="username" autocapitalize="none" required></label>
<label class="field">Password<input id="ap" type="password" autocomplete="current-password" required></label>
<p id="aerr" class="err" role="alert" hidden></p>
<button class="btn wide" id="abtn">Sign in</button>
<p class="fine center"><button type="button" id="switch" class="linkbtn">Create an account</button></p>
</form>
</div>
<div id="shell" class="shell" hidden>
<div class="tabs-wrap">
<div id="banner" class="banner" role="status" hidden></div>
<header class="bar"><h1 id="tabtitle" class="ui-h">Chats</h1></header>
<section id="tab-chats" class="tabpane" role="tabpanel" aria-labelledby="t-chats"><div id="threads" class="group"></div></section>
<section id="tab-links" class="tabpane" role="tabpanel" aria-labelledby="t-links" hidden>
<form id="lf" class="newlink"><label class="sr" for="ll">New link name</label><input id="ll" placeholder="Name a link, e.g. Used bike post" maxlength="60" required><button class="btn">Create</button></form>
<p id="lerr" class="err" role="alert" hidden></p>
<div id="links" class="group"></div>
</section>
<section id="tab-settings" class="tabpane" role="tabpanel" aria-labelledby="t-settings" hidden><div id="settings" class="group"></div><p class="fine center" style="margin-top:20px"><a href="/about">About</a> &middot; <a href="/blog">Blog</a> &middot; <a href="https://github.com/Advay254/allovchat">Source</a></p></section>
</div>
<nav id="tabbar" class="tabbar" role="tablist" aria-label="Sections"></nav>
<main id="chatview" class="chatview" aria-label="Conversation"></main>
</div>
<script src="/static/ui.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

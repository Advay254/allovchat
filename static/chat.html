<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Private chat</title>
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<div id="start" class="intro" hidden>
<div class="intro-in stag">
<img src="/favicon.svg" width="48" height="48" alt="">
<h1 id="lbl" class="ui-h"></h1>
<p id="about" class="fine" hidden></p>
<p id="welcome" style="margin:0;font-size:18px"></p>
<form id="sf" style="display:flex;flex-direction:column;gap:12px">
<label class="sr" for="sm">Your message</label>
<textarea id="sm" rows="5" placeholder="Write your message" required></textarea>
<div id="ts"></div>
<p id="serr" class="err" role="alert" hidden></p>
<button class="btn wide" id="sbtn">Send anonymously</button>
</form>
<p class="fine">Chats aren't end-to-end encrypted, and old ones are deleted automatically.</p>
<p class="fine"><a href="/">Make your own private link</a></p>
</div>
</div>
<main id="chatview" class="chatview solo" aria-label="Conversation" hidden></main>
<div id="gone" class="intro" hidden><div class="intro-in"><h1 class="ui-h">This link isn't active</h1><p class="fine">It may have been paused or removed by its owner.</p><p class="fine"><a href="/">Make your own private link</a></p></div></div>
<script src="/static/ui.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/visitor.js"></script>
</body>
</html>

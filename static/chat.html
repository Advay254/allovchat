<div id="start" class="intro" hidden>
<div class="intro-in stag">
<div class="logo" style="display:flex;align-items:center;gap:10px"><img src="/static/logo-mark.svg" width="54" height="32" alt=""><span class="wm">allov<b>chat</b></span></div>
<h1 id="lbl" class="ui-h"></h1>
<p id="about" class="fine" hidden></p>
<p id="welcome" style="margin:0;font-size:18px"></p>
<form id="sf" style="display:flex;flex-direction:column;gap:12px">
<label class="sr" for="sm">Your message</label>
<textarea id="sm" rows="5" placeholder="Say hello. Chat first, share later." required></textarea>
<div id="ts"></div>
<p id="serr" class="err" role="alert" hidden></p>
<button class="btn wide" id="sbtn">Send anonymously</button>
</form>
<div class="note"><span id="nico"></span><span id="ttlnote"></span></div>
<p class="fine">You get a fresh temporary name for every chat.</p>
<p class="fine"><a href="/">Make your own private link</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></p>
</div>
</div>
<main id="chatview" class="chatview solo" aria-label="Conversation" hidden></main>
<div id="gone" class="intro" hidden><div class="intro-in"><h1 class="ui-h">This link isn't active</h1><p class="fine">It may have been paused, removed, or the chat may have ended.</p><p class="fine"><a href="/">Make your own private link</a></p></div></div>
